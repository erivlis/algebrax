[project]
copyright = "Copyright &copy; 2026 Eran Rivlis"
site_name = "AlgebraX"
site_author = "Eran Rivlis"
site_description = ""
repo_url = "https://github.com/erivlis/algebrax"
repo_name = "erivlis/algebrax"
#license = "https://github.com/erivlis/algebrax/LICENSE"
extra_css = [
    "stylesheets/extra.css"
]
extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js"
]
nav = [
    { Start = [
        "index.md",
        "concepts.md",
        "comparison.md"
    ] },
    { Guide = [
        { "Semiring Polymorphism" = [
            "guide/semirings/index.md",
            "guide/semirings/arithmetic.md",
            "guide/semirings/optimization.md",
            "guide/semirings/logic.md",
            "guide/semirings/statistical.md",
            "guide/semirings/algebraic.md",
            "guide/semirings/verification.md",
        ] },
        { "Sparse Linear Algebra" = [
            "guide/matrix/core.md",
            "guide/matrix/academic.md",
            "guide/matrix/decompositions.md",
            "guide/matrix/benchmarks.md",
        ] },
        { "Tensors & Multi-Indices" = [
            "guide/tensor/trie.md",
            "guide/tensor/einsum.md",
        ] },
        { "Topology & Homology" = [
            "guide/homology/simplicial.md",
            "guide/homology/chain_complex.md",
        ] },
        { "Transforms & Analysis" = [
            "guide/transforms/spectral.md",
            "guide/analysis/discrete_calculus.md",
        ] },
        { "Probability & Information" = [
            "guide/probability/information.md",
        ] },
        { "Discrete, Automata & Category" = [
            "guide/discrete/automata.md",
            "guide/discrete/category.md",
            "guide/discrete/algebra.md",
        ] },
    ] },
    { Recipes = [
        "recipes.md"
    ] },
    { Proposals = [
        "eps.md"
    ] }
]


[project.theme]
variant = "classic"
font.text = "Inter"
font.code = "JetBrains Mono"
language = "en"
logo = "assets/images/logo-light.png"
favicon = "assets/images/logo-light.png"
features = [
    "content.code.copy",
    "content.code.select",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    #    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "toc.follow",
]


