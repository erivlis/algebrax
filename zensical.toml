[project]
copyright = "Copyright &copy; 2026 Eran Rivlis"
site_name = "AlgebraX"
site_author = "Eran Rivlis"
site_description = ""
repo_url = "https://github.com/erivlis/algebrax"
repo_name = "erivlis/algebrax"
#license = "https://github.com/erivlis/algebrax/LICENSE"
extra_css = [
    "stylesheets/extra.css"
]
extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js"
]
nav = [
    { Start = [
        "index.md",
        "concepts.md"
    ] },
    { Tutorials = [
        { Semirings = [
            "tutorials/semirings/semiring_standard.md",
            "tutorials/semirings/semiring_tropical.md",
            "tutorials/semirings/semiring_monoid_algebra.md",
            "tutorials/semirings/semiring_polynomial.md",
            "tutorials/semirings/semiring_knot.md",
            "tutorials/semirings/semiring_provenance.md",
            "tutorials/semirings/semiring_digital.md",
            "tutorials/semirings/semiring_convex_hull.md",
            "tutorials/semirings/semiring_matrix.md",
            "tutorials/semirings/semiring_boolean.md",
            "tutorials/semirings/semiring_viterbi.md",
            "tutorials/semirings/semiring_quotient_monoid_algebra.md",
            "tutorials/semirings/semiring_clifford.md",
            "tutorials/semirings/semiring_galois.md",
        ] },
        { Structures = [
            "tutorials/structures/algebraic_trie.md",
            "tutorials/structures/sparse_chain_complex.md",
            "tutorials/structures/categorical_kleisli.md",
        ] },
        { Transforms = [
            "tutorials/transforms/image_convolution.md",
            "tutorials/transforms/fenchel_legendre.md",
            "tutorials/transforms/walsh_hadamard.md"
        ] },
        { Graphs = [
            "tutorials/graphs/pagerank.md",
            "tutorials/graphs/cyk_parsing.md",
            "tutorials/graphs/catalan.md"
        ] },
        { Performance = [
            "tutorials/performance/benchmark_matrix_mult.md"
        ] }
    ] },
    { Recipes = [
        "recipes.md"
    ] },
    { Proposals = [
        "proposals/EP-0000-process.md",
        "proposals/EP-0099-expansion-roadmap.md",
        "proposals/EP-0100-quotient-monoid-algebra.md",
        "proposals/EP-0101-sparse-chain-complex.md",
        "proposals/EP-0110-simplicial-homology.md",
        "proposals/EP-0111-clifford-geometric-algebra.md",
        "proposals/EP-0112-galois-finite-fields.md",
        "proposals/EP-0113-categorical-kleisli.md"
    ] }
]


[project.theme]
variant = "classic"
font.text = "Inter"
font.code = "JetBrains Mono"
language = "en"
logo = "assets/images/logo-light.png"
favicon = "assets/images/logo-light.png"
features = [
    "content.code.copy",
    "content.code.select",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    #    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "toc.follow",
]


