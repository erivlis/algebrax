name: Benchmarks & CodSpeed

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows CodSpeed to trigger backtest performance analysis on historical commits.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          uv sync --group benchmark

      - name: Run pytest-benchmark (Walltime Statistics)
        run: |
          uv run pytest benchmarks/ --benchmark-only

      - name: Run CodSpeed Benchmarks (Instruction Count & PR Reports)
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: uv run pytest benchmarks/ --codspeed
